[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gemma2b"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "transformers",
    "peft",
    "bitsandbytes",
    "accelerate",
    "numpy<2.4",  # numpy>=2.4 breaks coremltools torch frontend (apple/coremltools#2633)
    "hf-transfer>=0.1.9",
    "coremltools>=9.0",
    "trl",
    "datasets",
    "openai",
    "python-dotenv",
]

[tool.setuptools.packages.find]
include = ["gemma2b*", "slm125m*", "shared*"]
